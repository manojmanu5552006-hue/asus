<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        header {
            background-color: #25274d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #464866;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        .hero {
            background: linear-gradient(120deg, #aa4b6b, #6b6b83, #3b8d99);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        .events {
            padding: 40px;
            text-align: center;
        }

        .events h2 {
            margin-bottom: 25px;
            color: #25274d;
        }

        .event-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .event-card {
            background: white;
            width: 280px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .event-card h3 {
            color: #aa4b6b;
            margin-bottom: 15px;
        }

        .event-card p {
            margin: 10px 0;
        }

        button {
            background-color: #25274d;
            color
